<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
<link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
     />
    <link rel="stylesheet" href="ForgotPassord.css"/>
</head>
<body>
   <div class="left-side"  >
            <img src="Assets/pics.png" class="overlay-image">
      <div class="down-image">
            <img src="Assets/Landing Image.png">
      </div>
    </div>


    <div class="right-side">
        <div class="Header">
            <h1>Password Reset</h1>
            <p>Provide the email address associated with your account to recover your password.</p>
            
        </div>  
        <div class="forgot-password-container">
            <form>
                <div class="input-group">
                    <label for="email">Email address <span>*</span></label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                
                
                
                <button type="submit">Reset Password</button>

                <p class="no-code">Didn't receive a reset link? <a href="#"> Resend</a> </p>
            </form>
            
        </div>
    </div>
</body>
</html>
