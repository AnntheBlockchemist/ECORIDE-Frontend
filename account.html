<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECORIDE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn">
<link rel="stylesheet" href="account.css">
</head>

<body>

<main class="create-account">

<section class="image-container">
<div class="image">
<img class="ecoride-logo" src="/assets/9d3d4ac1f52b671d7d8015f5c834710838fb80cf.png" alt="Ecoride Logo.">
<img class="car-ride" src="assets/49535fcb28936920890577eda3fa2c02b82660a4.png" alt="Car ride.">
</div>
</section>


<section class="input-container">

<div class="input-form">

<header class="heading">
<h1>Create <span>Account</span> </h1>
<h2 class="sub-heading">Join Ecoride and start carpooling today.</h2>
</header>


<section class="form-body">
<form>


<div class="input-data">
<label for="companyname">Company name</label>
<input type="text" placeholder="Enter company Name" id="companyname">


<label for="emailaddress">Email address</label>
<input type="email" placeholder="Enter email address" id="emailaddress">


<label for="password">Password</label>
<input type="password" placeholder="Enter password" id="password">


<label for="password">Confirm password</label>
<input type="password" placeholder="Enter password" id="password">

<div class="phonenumber-container">

<label for="phonenumber">Phone number</label>
<div class="phonenumber-input">
    <img width: 21px; height:16px; src="assets/nigeriaflag.svg" alt="Nigeria flag">
    <select name="" id="">+234</select>
>
<span>+234</span>
<input type="tel" placeholder="8129038428" id="phonenumber">
</div>

</div>

</div>


<div class="button-wrapper">
<button type="submit" class="signup-button">Sign Up</button>
<p class="login">Already have an account? <a href="#">Login</a></p>
</div>


</form>
</section>

</main>
</body>
</html>
